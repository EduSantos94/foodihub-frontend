services:
  # ==================== Frontend (Web) ====================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodihub_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    env_file:
      - .env
    environment:
      VITE_FOODIHUB_API_URL: http://backend:3333
    networks:
      - foodihub_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/" ]
      interval: 15s
      timeout: 5s
      retries: 5

# ==================== Networks ====================
networks:
  foodihub_network:
    external: true

services:
  # ==================== Frontend (Web) ====================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodihub_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    env_file:
      - .env
    networks:
      - foodihub_frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 5

# ==================== Networks ====================
networks:
  foodihub_frontend:
    driver: bridge
